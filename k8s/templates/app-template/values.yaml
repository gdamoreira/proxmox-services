# Default values for APP_NAME.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: nginxdemos/hello
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "plain-text"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: starter-app.apps.damoreira.ml
      paths:
        - path: /
          pathType: Prefix
    - host: starter-app.k8s.damoreira.ml
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Environment variables as key-value pairs
env: []
# env:
#   - name: ENVIRONMENT
#     value: "production"

# Load environment variables from existing ConfigMaps or Secrets
envFrom: []
# envFrom:
#   - secretRef:
#       name: app-secrets

nodeSelector: {}
tolerations: []
affinity: {}
