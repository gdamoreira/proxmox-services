---
- hosts: suwayomi
  vars_files:
    - "../roles/backup/vars/default.yml"
  tasks:
    - name: Install NFS utils
      ansible.builtin.package:
        name: nfs-common
        state: present

    - name: Mount backup NFS share
      ansible.builtin.mount:
        src: "{{ backup_nfs_server }}:{{ backup_nfs_share }}"
        path: "{{ backup_mount }}"
        opts: "{{ backup_nfs_opts }}"
        fstype: nfs
        state: mounted

    - name: Deploy backup script
      ansible.builtin.template:
        src: "../roles/backup/templates/backup-suwayomi.sh.j2"
        dest: "/usr/local/bin/backup-suwayomi.sh"
        mode: "0700"

    - name: Install backup cron job (daily at 03:00)
      ansible.builtin.cron:
        name: backup-suwayomi
        minute: "0"
        hour: "3"
        job: "/usr/local/bin/backup-suwayomi.sh"

    - name: Run backup immediately
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-suwayomi.sh
      changed_when: true
      tags: [backup, never]
