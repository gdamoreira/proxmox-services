---
- hosts: suwayomi
  gather_facts: false
  pre_tasks:
    - name: Check if Python is installed
      ansible.builtin.raw: which python3
      register: python_check
      ignore_errors: true
      changed_when: false
      tags: always
    - name: Bootstrap Python
      ansible.builtin.raw: apk add --no-cache python3
      changed_when: false
      when: python_check is failed
      tags: always
    - name: Gather facts
      ansible.builtin.setup:
      tags: always
    - name: Remove conflicting Docker repo file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_debian.list
        state: absent
      tags: always
  roles:
    - { role: common, tags: all }
    - { role: suwayomi, tags: suwayomi }