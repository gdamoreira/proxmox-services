---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - unzip
      - software-properties-common
      - python3-pip
      - python3-setuptools
      - python3-venv
    state: latest

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker

- name: Create media stack directory
  ansible.builtin.file:
    path: "{{ media_stack_dir }}"
    state: directory
    mode: "0755"

- name: Create config subdirectories
  ansible.builtin.file:
    path: "{{ media_stack_dir }}/config/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - plex
    - tautulli
    - kometa
    - overseerr
    - radarr
    - sonarr
    - bazarr
    - prowlarr
    - qbittorrent
    - tdarr
    - homepage
    - uptime-kuma
    - dozzle
    - shinkro

- name: Create Plex Plug-ins directory
  ansible.builtin.file:
    path: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins"
    state: directory
    mode: "0755"

- name: Create Plex Scanners directory
  ansible.builtin.file:
    path: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Scanners/Series"
    state: directory
    mode: "0755"

- name: Install HamaTV agent bundle
  ansible.builtin.unarchive:
    src: https://github.com/ZeroQI/Hama.bundle/archive/master.zip
    dest: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins"
    remote_src: true
  notify: Restart Media Stack

- name: Rename Hama.bundle directory
  ansible.builtin.shell:
    cmd: mv "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins/Hama.bundle-master" "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins/Hama.bundle"
    creates: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins/Hama.bundle"

- name: Install Absolute Series Scanner
  ansible.builtin.unarchive:
    src: https://github.com/ZeroQI/Absolute-Series-Scanner/archive/master.zip
    dest: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Scanners/Series"
    remote_src: true
  notify: Restart Media Stack

- name: Rename Absolute Series Scanner directory
  ansible.builtin.shell:
    cmd: mv "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Scanners/Series/Absolute-Series-Scanner-master" "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Scanners/Series/Absolute Series Scanner.bundle"
    creates: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Scanners/Series/Absolute Series Scanner.bundle"

- name: Remove misplaced Absolute Series Scanner from Plug-ins
  ansible.builtin.file:
    path: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins/{{ item }}"
    state: absent
  loop:
    - Absolute Series Scanner.bundle
    - Absolute-Series-Scanner-master

- name: Clean up leftover -master directories
  ansible.builtin.file:
    path: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server/Plug-ins/{{ item }}"
    state: absent
  loop:
    - Hama.bundle-master

- name: Fix ownership of Plex plugins and scanners
  ansible.builtin.file:
    path: "{{ media_stack_dir }}/config/plex/Library/Application Support/Plex Media Server"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: true
  notify: Restart Media Stack

- name: Install NFS utils
  ansible.builtin.apt:
    pkg:
      - nfs-common
    state: latest

- name: Mount NFS media share
  ansible.builtin.mount:
    src: "{{ media_nfs_server }}:{{ media_nfs_share }}"
    path: "{{ media_dir }}"
    opts: "vers=4,rsize=65536,wsize=65536,hard,timeo=600,retrans=2,_netdev"
    fstype: nfs
    state: mounted

- name: Deploy .env file
  ansible.builtin.template:
    src: ".env.j2"
    dest: "{{ media_stack_dir }}/.env"
    mode: "0644"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ media_stack_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy Kometa config
  ansible.builtin.template:
    src: "kometa/config.yml.j2"
    dest: "{{ media_stack_dir }}/config/kometa/config.yml"
    mode: "0644"

- name: Start media stack
  community.docker.docker_compose_v2:
    project_src: "{{ media_stack_dir }}"
    state: present
    pull: always
  notify:
    - Restart Media Stack
