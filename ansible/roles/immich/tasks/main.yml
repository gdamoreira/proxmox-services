---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
      - nfs-common
    state: latest

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker

- name: Disable AppArmor in the container
  ansible.builtin.systemd:
    name: apparmor
    state: stopped
    enabled: false
  ignore_errors: true

- name: Mount Immich NFS share
  ansible.builtin.mount:
    src: "{{ immich_nfs_server }}:{{ immich_nfs_share }}"
    path: "{{ immich_nfs_mount }}"
    opts: "{{ immich_nfs_opts }}"
    fstype: nfs
    state: mounted

- name: Create immich data directory
  ansible.builtin.file:
    path: "{{ immich_data_dir }}"
    state: directory
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_data_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ immich_data_dir }}/.env"
    mode: "0644"
  no_log: true

- name: Ensure immich is running
  community.docker.docker_compose_v2:
    project_src: "{{ immich_data_dir }}"
    state: present
    pull: always
