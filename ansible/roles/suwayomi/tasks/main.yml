---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"
  tags: always

- name: Upgrade dependencies (Debian)
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
  when: ansible_facts.os_family == "Debian"

- name: Upgrade dependencies (Alpine)
  community.general.apk:
    upgrade: true
  when: ansible_facts.os_family == "Alpine"

- name: Install prerequisites (Debian)
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - nfs-common
      - gnupg
    state: latest
  when: ansible_facts.os_family == "Debian"

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Remove conflicting Docker repo file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_debian.list
    state: absent
  when: ansible_facts.os_family == "Debian"

- name: Add Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    mode: "0644"
  when: ansible_facts.os_family == "Debian"

- name: Install Docker packages (Debian)
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Install required packages (Alpine)
  community.general.apk:
    name:
      - ca-certificates
      - curl
      - docker
    state: latest
  when: ansible_facts.os_family == "Alpine"

- name: Create suwayomi data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ suwayomi_data_dir }}"
    - "{{ suwayomi_data_dir }}/downloads"
    - "{{ suwayomi_data_dir }}/files"
    - "{{ suwayomi_compose_dir }}"

- name: Ensure Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ suwayomi_compose_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy logs.sh
  ansible.builtin.template:
    src: logs.sh.j2
    dest: "{{ suwayomi_compose_dir }}/logs.sh"
    mode: "0755"

- name: Deploy update.sh
  ansible.builtin.template:
    src: update.sh.j2
    dest: "{{ suwayomi_compose_dir }}/update.sh"
    mode: "0755"

- name: Ensure suwayomi is running
  community.docker.docker_compose_v2:
    project_src: "{{ suwayomi_compose_dir }}"
    state: present

#
# NFS mounts for downloads
#
- name: Mount downloads from codex
  ansible.builtin.mount:
    src: "10.0.10.1:/volume1/codex/applications/suwayomi/downloads"
    path: /var/suwayomi/downloads
    opts: "vers=4,rsize=65536,wsize=65536,hard,timeo=600,retrans=2,_netdev"
    fstype: nfs
    state: mounted
  tags: nfs

#
# MOTD
#
- name: Deploy LXC details profile script
  ansible.builtin.template:
    src: 00_lxc-details.sh.j2
    dest: /etc/profile.d/00_lxc-details.sh
    mode: "0644"
  tags: motd

#
# Database restore (run with --tags restore)
#
- name: Stop containers for restore
  community.docker.docker_compose_v2:
    project_src: "{{ suwayomi_compose_dir }}"
    state: stopped
  tags: [restore, never]

- name: Copy backup archive to LXC
  ansible.builtin.copy:
    src: "{{ suwayomi_restore_src }}"
    dest: /tmp/suwayomi-restore.tar.gz
    mode: "0644"
  when: suwayomi_restore_src | length > 0
  tags: [restore, never]

- name: Extract database and config from backup
  ansible.builtin.unarchive:
    src: /tmp/suwayomi-restore.tar.gz
    dest: /var/suwayomi/files
    remote_src: true
  when: suwayomi_restore_src | length > 0
  tags: [restore, never]

- name: Fix ownership
  ansible.builtin.file:
    path: /var/suwayomi/files
    owner: root
    group: root
    recurse: true
  tags: [restore, never]

- name: Start containers after restore
  community.docker.docker_compose_v2:
    project_src: "{{ suwayomi_compose_dir }}"
    state: present
  tags: [restore, never]