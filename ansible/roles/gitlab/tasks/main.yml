---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"
  tags: [always, restore]

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - openssh-server
      - tzdata
      - perl
      - cifs-utils
    state: latest

- name: Download GitLab EE package
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/gitlab/gitlab-ee/packages/ubuntu/jammy/gitlab-ee_{{ gitlab_version }}-ee.0_amd64.deb/download.deb"
    dest: "/tmp/gitlab-ee.deb"
    timeout: 120

- name: Install GitLab EE
  ansible.builtin.apt:
    deb: "/tmp/gitlab-ee.deb"
  environment:
    EXTERNAL_URL: "https://{{ gitlab_hostname }}"
    GITLAB_ROOT_PASSWORD: "{{ gitlab_root_password }}"

- name: Configure gitlab.rb
  ansible.builtin.lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: "^#?\\s*external_url\\b"
      line: "external_url 'https://{{ gitlab_hostname }}'"
    - regexp: "^#?\\s*gitlab_rails\\['gitlab_shell_ssh_port'\\]"
      line: "gitlab_rails['gitlab_shell_ssh_port'] = {{ gitlab_ssh_port }}"
    - regexp: "^#?\\s*nginx\\['listen_port'\\]"
      line: "nginx['listen_port'] = 80"
    - regexp: "^#?\\s*nginx\\['listen_https'\\]"
      line: "nginx['listen_https'] = false"
    - regexp: "^#?\\s*nginx\\['redirect_http_to_https'\\]"
      line: "nginx['redirect_http_to_https'] = false"
    - regexp: "^#?\\s*nginx\\['proxy_set_headers'\\]"
      line: "nginx['proxy_set_headers'] = { \"X-Forwarded-Proto\" => \"https\", \"X-Forwarded-Ssl\" => \"on\" }"
    - regexp: "^#?\\s*gitlab_sshd\\['enable'\\]"
      line: "gitlab_sshd['enable'] = true"
    - regexp: "^#?\\s*gitlab_sshd\\['listen_address'\\]"
      line: "gitlab_sshd['listen_address'] = \"0.0.0.0:{{ gitlab_ssh_port }}\""

- name: Grant gitlab-sshd CAP_NET_BIND_SERVICE for privileged port
  ansible.builtin.command:
    cmd: "setcap cap_net_bind_service=+ep /opt/gitlab/embedded/service/gitlab-shell/bin/gitlab-sshd"
    changed_when: false
  when: gitlab_ssh_port | int < 1024

- name: Reconfigure GitLab
  ansible.builtin.command:
    cmd: gitlab-ctl reconfigure
    creates: /var/opt/gitlab/bootstrapped

- name: Wait for GitLab to be ready
  ansible.builtin.uri:
    url: "http://localhost/users/sign_in"
    status_code: 200
  register: gitlab_web
  retries: 30
  delay: 10
  until: gitlab_web.status == 200

#
# Restore tasks (run with --tags restore)
#
- name: Stop gitlab services for restore
  ansible.builtin.command:
    cmd: gitlab-ctl stop unicorn && gitlab-ctl stop sidekiq
  ignore_errors: true
  tags: [restore, never]

- name: Download backup tar from CIFS share via smbclient
  ansible.builtin.shell:
    cmd: >
      smbclient "//{{ cifs_server }}/{{ cifs_share }}"
      -U "{{ cifs_username }}%{{ cifs_password }}"
      -c 'cd {{ gitlab_backup_path }}; get {{ gitlab_backup_file }} /var/opt/gitlab/backups/{{ gitlab_backup_file }}'
    creates: "/var/opt/gitlab/backups/{{ gitlab_backup_file }}"
  tags: [restore, never]

- name: Download config backup from CIFS share via smbclient
  ansible.builtin.shell:
    cmd: >
      smbclient "//{{ cifs_server }}/{{ cifs_share }}"
      -U "{{ cifs_username }}%{{ cifs_password }}"
      -c 'cd {{ gitlab_config_path }}; get {{ gitlab_config_backup_file }} /tmp/gitlab_config_backup.tar'
    creates: "/tmp/gitlab_config_backup.tar"
  tags: [restore, never]

- name: Extract gitlab-secrets.json from config backup
  ansible.builtin.command:
    cmd: "tar -xf /tmp/gitlab_config_backup.tar -C /etc/gitlab/ --strip-components=2 ./etc/gitlab/gitlab-secrets.json"
    creates: "/etc/gitlab/gitlab-secrets.json"
  tags: [restore, never]

- name: Restore gitlab from backup
  ansible.builtin.shell:
    cmd: "gitlab-backup restore BACKUP={{ gitlab_backup_file | regex_replace('_gitlab_backup\\.tar$', '') }} force=yes"
  tags: [restore, never]

- name: Reconfigure gitlab after restore
  ansible.builtin.command:
    cmd: gitlab-ctl reconfigure
  tags: [restore, never]

- name: Restart gitlab services
  ansible.builtin.command:
    cmd: gitlab-ctl restart
  tags: [restore, never]
