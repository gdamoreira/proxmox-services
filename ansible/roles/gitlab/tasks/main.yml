---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: latest

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker

- name: Create gitlab data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ gitlab_data_dir }}"
    - "{{ gitlab_data_dir }}/config"
    - "{{ gitlab_data_dir }}/logs"
    - "{{ gitlab_data_dir }}/data"
    - "{{ gitlab_data_dir }}/data/backups"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_data_dir }}/docker-compose.yml"
    mode: "0644"

- name: Ensure gitlab is running
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_data_dir }}"
    state: present
    pull: always

#
# Restore tasks (run with --tags restore)
#
- name: Stop gitlab container for restore
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_data_dir }}"
    state: stopped
  tags: [restore, never]

- name: Copy backup tar to data dir
  ansible.builtin.copy:
    src: "{{ gitlab_backup_src }}"
    dest: "{{ gitlab_data_dir }}/data/backups/"
    mode: "0644"
  when: gitlab_backup_src | length > 0
  tags: [restore, never]

- name: Copy gitlab-secrets.json to config dir
  ansible.builtin.copy:
    src: "files/gitlab-secrets.json.reference"
    dest: "{{ gitlab_data_dir }}/config/gitlab-secrets.json"
    mode: "0600"
  tags: [restore, never]

- name: Start gitlab for restore
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_data_dir }}"
    state: present
  tags: [restore, never]

- name: Wait for gitlab to be ready
  ansible.builtin.pause:
    seconds: 30
  tags: [restore, never]

- name: Restore gitlab from backup
  ansible.builtin.command:
    cmd: "docker compose exec -T gitlab gitlab-backup restore BACKUP={{ gitlab_backup_timestamp }} force=yes"
    chdir: "{{ gitlab_data_dir }}"
  when: gitlab_backup_timestamp | length > 0
  tags: [restore, never]

- name: Reconfigure gitlab after restore
  ansible.builtin.command:
    cmd: "docker compose exec -T gitlab gitlab-ctl reconfigure"
    chdir: "{{ gitlab_data_dir }}"
  tags: [restore, never]

- name: Restart gitlab after restore
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_data_dir }}"
    state: restarted
  tags: [restore, never]
