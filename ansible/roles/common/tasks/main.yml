---
- name: Upgrade dependencies (Debian)
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
  when: ansible_facts.os_family == "Debian"
  tags: always

- name: Upgrade dependencies (RedHat)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: ansible_facts.os_family == "RedHat"
  tags: always

- name: Install kitty-terminfo (Debian)
  ansible.builtin.apt:
    pkg:
      - kitty-terminfo
    state: latest
  when: ansible_facts.os_family == "Debian"
