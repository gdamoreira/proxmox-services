---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
    state: latest

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker

- name: Disable AppArmor in the container
  ansible.builtin.systemd:
    name: apparmor
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove invalid daemon.json if exists
  ansible.builtin.file:
    path: /etc/docker/daemon.json
    state: absent

- name: Restart Docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Create ghost data directory
  ansible.builtin.file:
    path: "{{ ghost_data_dir }}"
    state: directory
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ghost_data_dir }}/docker-compose.yml"
    mode: "0644"

- name: Ensure ghost is running
  community.docker.docker_compose_v2:
    project_src: "{{ ghost_data_dir }}"
    state: present
    pull: always
