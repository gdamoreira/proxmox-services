---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
      - python3-setuptools
      - python3-venv
      - cifs-utils
    state: latest

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker

- name: Create jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ jellyfin_data_dir }}"
    - "{{ jellyfin_data_dir }}/config"
    - "{{ jellyfin_data_dir }}/cache"

- name: Create media mount point
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    mode: "0755"

- name: Create SMB credentials directory
  ansible.builtin.file:
    path: /etc/samba/credentials
    state: directory
    mode: "0700"

- name: Deploy SMB credentials for media share
  ansible.builtin.copy:
    dest: /etc/samba/credentials/media
    content: |
      username={{ media_share_username }}
      password={{ media_share_password }}
      domain=WORKGROUP
    mode: "0600"
  no_log: true

- name: Mount CIFS media share
  ansible.builtin.mount:
    src: "{{ media_share }}"
    path: "{{ media_dir }}"
    opts: "credentials=/etc/samba/credentials/media,uid=0,gid=0,iocharset=utf8,vers=3.0"
    fstype: cifs
    state: mounted

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_data_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy LXC details profile script
  ansible.builtin.template:
    src: 00_lxc-details.sh.j2
    dest: /etc/profile.d/00_lxc-details.sh
    mode: "0644"

- name: Ensure jellyfin is running
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_data_dir }}"
    state: present
    pull: always
