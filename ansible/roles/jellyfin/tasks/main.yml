---
- name: Include config vars
  ansible.builtin.include_vars: "vars/default.yml"

- name: Upgrade dependencies
  ansible.builtin.apt:
    update_cache: true
    upgrade: full

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
      - python3-setuptools
      - python3-venv
      - nfs-common
    state: latest

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker

- name: Create jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ jellyfin_data_dir }}"
    - "{{ jellyfin_data_dir }}/config"
    - "{{ jellyfin_data_dir }}/cache"

- name: Mount NFS media share
  ansible.builtin.mount:
    src: "{{ media_nfs_server }}:{{ media_nfs_share }}"
    path: "{{ media_dir }}"
    opts: "vers=4,rsize=65536,wsize=65536,hard,timeo=600,retrans=2,_netdev"
    fstype: nfs
    state: mounted

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_data_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy LXC details profile script
  ansible.builtin.template:
    src: 00_lxc-details.sh.j2
    dest: /etc/profile.d/00_lxc-details.sh
    mode: "0644"

- name: Ensure jellyfin is running
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_data_dir }}"
    state: present
    pull: always
